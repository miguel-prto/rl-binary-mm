[project]
name = "tfg"
version = "0.1.0"
description = "Adaptive liquidity provision in prediction markets using RL: data recorder, simulator and agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Miguel Prieto" }]
dependencies = [
    "websockets>=14",
    "httpx>=0.27",
    "orjson>=3.10",
    "zstandard>=0.23",
    "pyarrow>=18",
    "polars>=1.10",
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/tfg"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["python"]

[tool.pyright]
include = ["python", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
