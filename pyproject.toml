[project]
name = "rl-binary-mm"
version = "0.1.0"
description = "Adaptive liquidity provision in prediction markets using RL: data pipeline, simulator and agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Miguel Prieto" }]
dependencies = [
    "marketrec",
    "orjson>=3.10",
    "pyarrow>=18",
    "polars>=1.10",
    "duckdb>=1.1",
]

[tool.uv.sources]
# Raw recordings are produced and read by the recorder package, pinned to a tag.
marketrec = { git = "https://github.com/miguel-prto/market-recorder", tag = "v0.1.0" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/rl_binary_mm"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["python"]

[tool.pyright]
include = ["python", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
